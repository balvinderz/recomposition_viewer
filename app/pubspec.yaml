name: recomposition_inspector
description: A macOS inspector for live Jetpack Compose recomposition data.
publish_to: none
version: 1.3.2+11

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  scrcpy_video_view: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo_mark.png
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/sora/Sora-Variable.ttf
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex-mono/IBMPlexMono-Bold.ttf
          weight: 700
